# Publishes any post whose date has arrived.
#
# build.py holds back posts dated in the future. This job re-runs the build
# once a day, so on the morning a post is due it appears on the site with no
# action from anyone. If nothing is due, the build produces no changes and the
# job exits without committing.
#
# The site is hosted on Cloudflare Pages (project: doctorarchers-site), which
# has NO Git connection. Pushing to GitHub does not deploy anything by itself,
# so this job deploys explicitly with wrangler after committing.
#
# Requires one repository secret:
#   CLOUDFLARE_API_TOKEN - a Cloudflare API token with "Cloudflare Pages: Edit"
#                          permission on this account.
#
# Until that secret exists the job still builds and commits, then skips the
# deploy with a loud warning rather than failing red every single day.

name: Publish scheduled posts

on:
  schedule:
    # 19:00 UTC daily = 12:00 noon in Arizona (MST, no daylight saving).
    # GitHub's scheduler is best-effort and can run late at busy times, so
    # treat this as "around noon" rather than exactly on the hour.
    - cron: "0 19 * * *"
  workflow_dispatch:        # lets you publish on demand from the Actions tab

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    # Lifted to job level so the deploy step can test whether the token exists.
    # The `secrets` context cannot be read directly inside an `if:` expression.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1d18bf879817a7681e338e3682580a87
      PAGES_PROJECT: doctorarchers-site

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build the site
        run: python3 build.py

      - name: Commit and push if anything became due
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing due today. No changes to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          NEW=$(git diff --cached --name-only --diff-filter=A -- blog/ | sed 's|blog/||;s|\.html$||' | paste -sd', ' -)
          git commit -m "Publish scheduled post(s): ${NEW:-rebuild}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Deploys when a post came due, and always on a manual run. The manual
      # case matters: edits to pages, styles or the footer are committed by
      # hand and would otherwise sit in the repo, never reaching the site,
      # because the Pages project has no Git connection.
      - name: Deploy to Cloudflare Pages
        if: >-
          env.CLOUDFLARE_API_TOKEN != '' &&
          (steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          npx --yes wrangler@4 pages deploy . \
            --project-name "$PAGES_PROJECT" \
            --branch main \
            --commit-dirty=true

      - name: Warn loudly if nothing was deployed
        if: steps.commit.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning title=Committed but NOT deployed::A scheduled post was committed to GitHub, but CLOUDFLARE_API_TOKEN is not set, so it was not deployed. The article is in the repo and NOT on the live site. Add the secret to fix this."
          exit 1
