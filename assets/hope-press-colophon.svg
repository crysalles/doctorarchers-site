<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hope Press colophon">
  <title>Hope Press</title>
  <!--
    Hope Press colophon — a sun rising over an open book.

    Drawn in one colour so the same file prints black on a title page and
    takes the site palette on the web. It inherits `currentColor`, so set the
    colour on the parent element; for print files, replace currentColor with
    #000. Monoline at 2.5 units, which holds together down to about 10mm.

    Six rays on an even arc, all the same length and the same gap from the
    disc — evenness is what keeps it from turning to mush at small sizes.
  -->
  <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- the sun -->
    <circle cx="32" cy="20" r="7" fill="currentColor" stroke="none"/>
    <!-- six rays at 0, ±38, ±76 degrees from vertical -->
    <path d="M32 9.5V5.5M38.5 11.7l2.4-3.2M25.5 11.7l-2.4-3.2M42.2 17.5l3.9-1M21.8 17.5l-3.9-1"/>
    <!-- the open book -->
    <path d="M32 38.5c-5.6-5.4-13.8-6.6-21.5-5.6v14.6c7.7-1 15.9.2 21.5 5.6"/>
    <path d="M32 38.5c5.6-5.4 13.8-6.6 21.5-5.6v14.6c-7.7-1-15.9.2-21.5 5.6"/>
    <path d="M32 38.5v14.6"/>
  </g>
</svg>
